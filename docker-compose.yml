# m3uRecorder + Gluetun
#
# El recorder comparte la red de Gluetun (network_mode: service:gluetun), así que
# todo su tráfico sale por la VPN y el puerto web se publica en el contenedor de
# Gluetun. La API de control de Gluetun (puerto 8000) NO se publica y además
# exige la clave GLUETUN_API_KEY.
#
# Uso:
#   cp .env.example .env   # y rellena tus datos
#   docker compose up -d

services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: m3u-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${WEB_PORT:-9984}:5000"
    volumes:
      - ./vpn:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ:-Europe/Madrid}
      # Importante: no debe existir ./vpn/auth/config.toml, porque tendría prioridad sobre esto
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"apikey","apikey":"${GLUETUN_API_KEY:?Define GLUETUN_API_KEY en .env}"}'
    restart: unless-stopped

  m3u-recorder:
    # Imagen ya construida (amd64 y arm64). Para construirla tú a partir del código,
    # cambia esta línea por:  build: .
    image: ghcr.io/allopism/m3urecorder:latest
    container_name: m3u-recorder
    # Usuario con el que se escriben las grabaciones (dueño de RECORDINGS_DIR en el host)
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - APP_TOKEN=${APP_TOKEN:-}
      - VPN_ENABLED=${VPN_ENABLED:-true}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - GLUETUN_API_KEY=${GLUETUN_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ${RECORDINGS_DIR:-./output}:/output
      - ${M3U_LIST_PATH:-./lista.m3u}:/app/lista.m3u:ro
      # Datos de servidores de Gluetun, para ofrecer la lista de países disponibles
      - ./vpn/servers:/gluetun/servers:ro
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    # Tiempo que Docker espera al apagar antes de matar el proceso a la fuerza.
    # Da margen a ffmpeg para cerrar el archivo y a la app para guardar el historial.
    stop_grace_period: 60s
    restart: unless-stopped
