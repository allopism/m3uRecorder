# m3uRecorder + Gluetun
#
# El recorder comparte la red de Gluetun (network_mode: service:gluetun), así que
# todo su tráfico sale por la VPN y el puerto web se publica en el contenedor de
# Gluetun. La API de control de Gluetun (puerto 8000) NO se publica: solo es
# accesible desde dentro de esa red compartida.
#
# Uso:
#   cp .env.example .env   # y rellena tus datos
#   docker compose up -d --build

services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: m3u-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${WEB_PORT:-9984}:5000"
    volumes:
      - ./vpn:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ:-Europe/Madrid}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    restart: unless-stopped

  m3u-recorder:
    build: .
    container_name: m3u-recorder
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ${RECORDINGS_DIR:-./output}:/output
      - ${M3U_LIST_PATH:-./lista.m3u}:/app/lista.m3u
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    # Tiempo que Docker espera al apagar antes de matar el proceso a la fuerza.
    # Da margen a ffmpeg para cerrar el archivo y a la app para guardar el historial.
    stop_grace_period: 60s
    restart: unless-stopped
