[project]
name = "m3urecorder"
version = "2.0.0"
description = "DVR autoalojado para grabar streams en directo con ffmpeg, con programador y VPN opcional"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
